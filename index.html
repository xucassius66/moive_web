<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WrongBooks - 错误书单</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo">WrongBooks</h1>
      <p class="tagline">记录那些让你后悔的书，也记录那些意外惊喜</p>
    </div>
  </header>

  <main class="container">
    <section class="add-section">
      <h2>添加书单</h2>
      <form id="bookForm">
        <div class="form-group">
          <input type="text" id="bookTitle" placeholder="书名" required />
        </div>
        <div class="form-group">
          <input type="text" id="bookAuthor" placeholder="作者" />
        </div>
        <div class="form-group">
          <select id="bookStatus">
            <option value="wrong">踩雷了（不推荐）</option>
            <option value="surprise">意外惊喜（推荐）</option>
            <option value="reading">正在读</option>
          </select>
        </div>
        <div class="form-group">
          <textarea id="bookNote" placeholder="备注（可选）" rows="3"></textarea>
        </div>
        <button type="submit" class="btn-primary">添加到书单</button>
      </form>
    </section>

    <section class="list-section">
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="wrong">踩雷</button>
        <button class="filter-btn" data-filter="surprise">惊喜</button>
        <button class="filter-btn" data-filter="reading">在读</button>
      </div>
      <div id="bookList" class="book-list"></div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 WrongBooks. 诚实的书单，真实的感受。</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
